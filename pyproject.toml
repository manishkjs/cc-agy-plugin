[build-system]
requires = []
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "cc-agy-plugin"
version = "0.3.0"
description = "Claude Code, Cursor, OpenCode, Antigravity, and Codex plugin for delegating tasks to Gemini via Gemini Enterprise (`agy` CLI), Google AI Studio, or Vertex AI (`google-antigravity` + `google-genai`) with Straitjacket shell containment."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "google-genai>=1.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
cc-agy-install = "server.install:main"
cc-agy-plugin = "server.install:main"

[project.optional-dependencies]
antigravity = [
    "google-antigravity>=0.1.0",
    "ctx-harness>=0.39.0; python_version >= '3.11'",
]
straitjacket = [
    "ctx-harness>=0.39.0; python_version >= '3.11'",
]
dev = [
    "pytest>=8.0.0",
    "pytest-xdist>=3.5.0",
    "jsonschema>=4.20.0",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["server*", "scripts*"]
namespaces = true

[tool.setuptools.package-data]
server = ["*.json", "_bundled_assets/**/*", "_bundled_assets/.*/*", "_bundled_assets/.*"]
scripts = ["*.sh", "*.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
