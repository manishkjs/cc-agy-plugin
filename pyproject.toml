[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-agy-plugin"
version = "0.1.0"
description = "Claude Code plugin for delegating tasks to Google AI Studio and Vertex AI Gemini models via the Google Antigravity SDK, google-genai, and Straitjacket shell containment."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "google-genai>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
antigravity = [
    "google-antigravity>=0.1.0",
    "ctx-harness>=0.39.0; python_version >= '3.11'",
]
straitjacket = [
    "ctx-harness>=0.39.0; python_version >= '3.11'",
]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["server*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
