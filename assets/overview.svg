<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/>
    </marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="470" rx="18" fill="#ffffff"/>

  <text x="500" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">How cc-agy-plugin works</text>
  <text x="500" y="72" text-anchor="middle" font-size="14" fill="#5f6368">Your agent stays in charge. A cheaper Gemini worker does the hands-on work. Nothing lands until it is checked.</text>

  <!-- Lead -->
  <g filter="url(#sh)">
    <rect x="30" y="110" width="270" height="220" rx="14" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  </g>
  <text x="165" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#b06000" letter-spacing="1">1. THE LEAD</text>
  <text x="165" y="174" text-anchor="middle" font-size="19" font-weight="700" fill="#202124">Your coding agent</text>
  <text x="165" y="196" text-anchor="middle" font-size="13" fill="#5f6368">Claude Code or Antigravity</text>
  <text x="54" y="236" font-size="14" fill="#3c4043">• Understands the request</text>
  <text x="54" y="262" font-size="14" fill="#3c4043">• Writes a short brief</text>
  <text x="54" y="288" font-size="14" fill="#3c4043">• Reviews and approves</text>

  <!-- Plugin -->
  <g filter="url(#sh)">
    <rect x="365" y="98" width="270" height="244" rx="14" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2.5"/>
  </g>
  <text x="500" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#1967d2" letter-spacing="1">2. THE PLUGIN</text>
  <text x="500" y="162" text-anchor="middle" font-size="19" font-weight="700" fill="#202124">cc-agy-plugin</text>
  <text x="500" y="184" text-anchor="middle" font-size="13" fill="#5f6368">Safety, testing and accounting</text>
  <text x="389" y="222" font-size="14" fill="#3c4043">• Isolated copy of the repo</text>
  <text x="389" y="248" font-size="14" fill="#3c4043">• Runs new and existing tests</text>
  <text x="389" y="274" font-size="14" fill="#3c4043">• Signs every change</text>
  <text x="389" y="300" font-size="14" fill="#3c4043">• Reports cost per job</text>

  <!-- Worker -->
  <g filter="url(#sh)">
    <rect x="700" y="110" width="270" height="220" rx="14" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="2"/>
  </g>
  <text x="835" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#137333" letter-spacing="1">3. THE WORKER</text>
  <text x="835" y="174" text-anchor="middle" font-size="19" font-weight="700" fill="#202124">Gemini model</text>
  <text x="835" y="196" text-anchor="middle" font-size="13" fill="#5f6368">Flash, Pro or Argon</text>
  <text x="724" y="236" font-size="14" fill="#3c4043">• Reads the code</text>
  <text x="724" y="262" font-size="14" fill="#3c4043">• Edits and runs tests</text>
  <text x="724" y="288" font-size="14" fill="#3c4043">• Retries until green</text>

  <!-- arrows Lead <-> Plugin -->
  <line x1="302" y1="190" x2="361" y2="190" stroke="#5f6368" stroke-width="2" marker-end="url(#arr)"/>
  <text x="332" y="181" text-anchor="middle" font-size="11" fill="#5f6368">brief</text>
  <line x1="361" y1="262" x2="302" y2="262" stroke="#5f6368" stroke-width="2" marker-end="url(#arr)"/>
  <text x="332" y="282" text-anchor="middle" font-size="11" fill="#5f6368">result</text>

  <!-- arrows Plugin <-> Worker -->
  <line x1="637" y1="190" x2="696" y2="190" stroke="#5f6368" stroke-width="2" marker-end="url(#arr)"/>
  <text x="667" y="181" text-anchor="middle" font-size="11" fill="#5f6368">task</text>
  <line x1="696" y1="262" x2="637" y2="262" stroke="#5f6368" stroke-width="2" marker-end="url(#arr)"/>
  <text x="667" y="282" text-anchor="middle" font-size="11" fill="#5f6368">diff</text>

  <!-- bottom promise strip -->
  <rect x="30" y="372" width="940" height="66" rx="12" fill="#202124"/>
  <text x="187" y="402" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Safe</text>
  <text x="187" y="424" text-anchor="middle" font-size="12.5" fill="#bdc1c6">Repo changes only after tests pass</text>
  <text x="500" y="402" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Traceable</text>
  <text x="500" y="424" text-anchor="middle" font-size="12.5" fill="#bdc1c6">Signed receipt per change, one-call undo</text>
  <text x="813" y="402" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Measured</text>
  <text x="813" y="424" text-anchor="middle" font-size="12.5" fill="#bdc1c6">Cost per job, in cents, Lead included</text>
  <line x1="343" y1="386" x2="343" y2="424" stroke="#5f6368" stroke-width="1"/>
  <line x1="657" y1="386" x2="657" y2="424" stroke="#5f6368" stroke-width="1"/>
</svg>
