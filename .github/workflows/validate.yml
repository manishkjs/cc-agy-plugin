name: Validate

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate manifests, docs, and portability tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test runner
        run: python -m pip install -e ".[dev]"

      - name: Validate plugin manifests and documentation sync
        run: bash scripts/validate.sh

      - name: Run full hermetic test suite
        run: python -m pytest -q
