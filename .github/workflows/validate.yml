name: Validate

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate manifests, lint, docs, and parallel tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package, linter, and parallel test runner
        run: |
          python -m pip install -e ".[antigravity,dev]"
          python -m pip install "git+https://github.com/vamsiramakrishnan/straitjacket.git@88b2af0511b426b9402010fc6568b20fbd9838c4"

      - name: Static lint check (ruff undefined names and syntax)
        run: python -m ruff check server scripts --select E9,F63,F7,F82

      - name: Validate plugin manifests, AST invariants, and documentation sync
        run: bash scripts/validate.sh

      - name: Run full hermetic test suite in parallel
        run: python -m pytest -n auto -q

  cross-platform-portability:
    name: Cross-platform portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify cross-platform imports, wheel assets, and FTUX / GE lock invariants
        run: |
          python scripts/lint_ast.py
          python -m pytest -q tests/test_ftux_and_decision_guide.py
